  <text x="107" y="320" text-anchor="middle">React browser</text><text x="107" y="348" text-anchor="middle">Three roles</text>
  <rect x="265" y="130" width="410" height="70" rx="8" class="box"/>
  <text x="470" y="160" text-anchor="middle">Session / role checks</text><text x="470" y="184" text-anchor="middle">HTTP JSON API routes</text>
  <rect x="265" y="245" width="185" height="65" rx="8" class="box"/>
  <text x="357" y="273" text-anchor="middle">OpenAI adapter</text><text x="357" y="296" text-anchor="middle" class="small">30 s deadline</text>
  <rect x="490" y="245" width="185" height="65" rx="8" class="box"/>
