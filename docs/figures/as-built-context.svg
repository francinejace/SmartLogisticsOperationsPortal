<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="730" viewBox="0 0 1120 730">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52645b"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#20392c;font-size:18px}.title{font-size:24px;font-weight:bold}.small{font-size:15px;fill:#52645b}.box{fill:white;stroke:#99b3a2;stroke-width:2}.external{fill:#f0f5f2;stroke:#668772;stroke-width:2}.edge{fill:none;stroke:#52645b;stroke-width:2;marker-end:url(#a)}</style>
  </defs>
  <rect width="1120" height="730" fill="white"/>
  <text x="30" y="36" class="title">TranceLogix: actual deployment and service boundaries</text>
